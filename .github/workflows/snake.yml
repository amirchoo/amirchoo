name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#DBA111&color_dots=#0d1b2a,#0a3a7a,#034694,#1e6fd9,#5fa8ff&color_dot_border=#0d1b2a
            dist/snake-light.svg?color_snake=#034694&color_dots=#ebedf0,#b9d3f5,#6ea3e8,#2a6fcf,#034694

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
